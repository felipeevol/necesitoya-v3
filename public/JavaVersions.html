  <style>
    body {
      font-family: helvetica;
      font-size: 14px;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #chart-scroll {
      width: 100vw;
      height: 100vh;
      overflow: auto;
    }

    #cy {
      width: 100%;
      height: 100%;
      min-width: 8500px;
      min-height: 950px;
      display: block;
      position: relative;
      z-index: 999;
      cursor: grab;
    }

    #cy.is-node-panning {
      cursor: grabbing;
    }

    /* Default styles for nodes and edges */
    .node-default-style {
      background-color: #666;
      /* Cor original */
      label: data(name);
      width: label;
      height: label;
      padding: 10px;
      shape: rectangle;
      color: white;
      text-valign: center;
      text-halign: center;
      border-width: 1px;
      border-color: #333;
      opacity: 1;
      transition: border-color 0.2s ease-in-out, border-width 0.2s ease-in-out;
    }

    .edge-default-style {
      width: 3;
      line-color: #ccc;
      target-arrow-color: #ccc;
      target-arrow-shape: triangle;
      curve-style: bezier;
      opacity: 1;
      transition: line-color 0.2s ease-in-out, width 0.2s ease-in-out;
    }

    /* Highlight style for the CLICKED NODE - NOW WITH BLUE BORDER */
    .node-clicked-highlight-style {
      border-color: #0000FF;
      /* BLUE border for the clicked node */
      border-width: 4px;
      /* Borda mais grossa para o nÃ³ clicado */
    }

    /* Highlight style ONLY for CONNECTED EDGES */
    .edge-highlighted-blue-style {
      line-color: #0000FF;
      /* Blue line */
      target-arrow-color: #0000FF;
      /* Blue arrow */
      source-arrow-color: #0000FF;
      /* Blue arrow */
      width: 6px;
      /* Thicker */
    }

    /* Tooltip Style */
    #tooltip {
      position: absolute;
      display: none;
      padding: 10px;
      background-color: #f4fbff;
      border: 2px solid #5aaecb;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 115, 150, 0.12);
      font-size: 16px;
      line-height: 1.4;
      color: #071922;
      z-index: 1000;
      /* Acima do canvas do Cytoscape */
      pointer-events: none;
      /* Para nÃ£o interferir com eventos do mouse no Cytoscape */
    }
  </style>
</head>

      function fitGraphToVisibleArea() {
        var padding = 10;
        var initialVisibleBounds = cy.nodes().filter(function (node) {
          return node.position("x") <= coluna6;
        }).boundingBox();
        var visibleWidth = chartScroll.clientWidth;
        var visibleHeight = chartScroll.clientHeight;
        var zoom = Math.min(
          (visibleWidth - (padding * 2)) / initialVisibleBounds.w,
          (visibleHeight - (padding * 2)) / initialVisibleBounds.h
        );

        cy.zoom(zoom);
        cy.pan({
          x: (visibleWidth - (zoom * (initialVisibleBounds.x1 + initialVisibleBounds.x2))) / 2,
          y: (visibleHeight - (zoom * (initialVisibleBounds.y1 + initialVisibleBounds.y2))) / 2
        });
      }

      fitGraphToVisibleArea();
      window.addEventListener("resize", fitGraphToVisibleArea);

        active: false,
        lastX: 0,
        lastY: 0,
        moved: false
      };
      var suppressNextNodeTap = false;

      function getPointerPoint(evt) {
        if (evt.touches && evt.touches.length > 0) {
          return { x: evt.touches[0].clientX, y: evt.touches[0].clientY };
        }

        if (evt.changedTouches && evt.changedTouches.length > 0) {
          return { x: evt.changedTouches[0].clientX, y: evt.changedTouches[0].clientY };
        }

        if (typeof evt.clientX === "number" && typeof evt.clientY === "number") {
          return { x: evt.clientX, y: evt.clientY };
        }

        return null;
      }

      function preventNodePanDefault(evt) {
        if (!evt) {
          return;
        }

        evt.preventDefault();
        evt.stopPropagation();
      }

      function startNodePan(evt) {
        var point = getPointerPoint(evt.originalEvent);
        if (!point) {
          return;
        }

        nodePanState.active = true;
        nodePanState.lastX = point.x;
        nodePanState.lastY = point.y;
        nodePanState.moved = false;
        chartContainer.classList.add("is-node-panning");
        tooltipDiv.style.display = "none";
        preventNodePanDefault(evt.originalEvent);
      }

      function continueNodePan(evt) {
        if (!nodePanState.active) {
          return;
        }

        var point = getPointerPoint(evt);
        if (!point) {
          return;
        }

        var deltaX = point.x - nodePanState.lastX;
        var deltaY = point.y - nodePanState.lastY;

        if (deltaX !== 0 || deltaY !== 0) {
          cy.panBy({ x: deltaX, y: deltaY });
          nodePanState.lastX = point.x;
          nodePanState.lastY = point.y;

          if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) {
            nodePanState.moved = true;
            suppressNextNodeTap = true;
          }
        }

        preventNodePanDefault(evt);
      }

      function stopNodePan(evt) {
        if (!nodePanState.active) {
          return;
        }

        nodePanState.active = false;
        chartContainer.classList.remove("is-node-panning");

        if (nodePanState.moved) {
          window.setTimeout(function () {
            suppressNextNodeTap = false;
          }, 350);
        }

        preventNodePanDefault(evt);
      }

      cy.on("mousedown touchstart", "node", startNodePan);
      window.addEventListener("mousemove", continueNodePan, { passive: false });
      window.addEventListener("touchmove", continueNodePan, { passive: false });
      window.addEventListener("mouseup", stopNodePan);
      window.addEventListener("touchend", stopNodePan);
      window.addEventListener("touchcancel", stopNodePan);

      cy.container().addEventListener("wheel", function (evt) {
        if (!evt.ctrlKey) {
          return;
        }

        evt.preventDefault();

        var zoomFactor = Math.pow(1.05, -evt.deltaY / 100);
        var nextZoom = cy.zoom() * zoomFactor;
        nextZoom = Math.max(cy.minZoom(), Math.min(cy.maxZoom(), nextZoom));
        var rect = cy.container().getBoundingClientRect();

        cy.zoom({
          level: nextZoom,
          renderedPosition: {
            x: evt.clientX - rect.left,
            y: evt.clientY - rect.top
          }
        });
      }, { passive: false });

      // Tooltip events
      cy.on("mouseover", "node", function (evt) {
        var node = evt.target;
        var nodeDescription = node.data("description");
        tooltipDiv.innerHTML = nodeDescription;
        tooltipDiv.style.display = "block";
        // Posiciona o tooltip perto do mouse
        // Adiciona um pequeno deslocamento para nÃ£o cobrir o cursor
        tooltipDiv.style.left = (evt.originalEvent.pageX + 15) + "px";
        tooltipDiv.style.top = (evt.originalEvent.pageY + 15) + "px";
        console.log("Mouseover no nÃ³: " + node.id() + ", Tooltip: " + nodeDescription);
      });

      cy.on("mouseout", "node", function (evt) {
        tooltipDiv.style.display = "none";
        console.log("Mouseout no nÃ³: " + evt.target.id());
      });

      let lastClickTime = 0;

      cy.on("tap", "node", function (evt) {
        if (suppressNextNodeTap) {
          suppressNextNodeTap = false;
          return;
        }

        var tappedNode = evt.target;
        console.log("NÃ³ clicado (v9):", tappedNode.id());

        const now = new Date().getTime();
        const timeDiff = now - lastClickTime;
        lastClickTime = now;

        if (timeDiff < 300) {

          // Agora, abre o link se existir
          var link = tappedNode.data("linkURL");
          if (link) {
            console.log("Abrindo link: " + link);
            window.open(link, "_blank"); // Abre em uma nova aba
          }

        }

        // Other nodes remain in their default state
      });

      cy.on("cxttap", "node", function (evt) {
        var tappedNode = evt.target;
        var link = tappedNode.data("rightLinkURL");
        if (link) {
          console.log("Abrindo link: " + link);
          window.open(link, "_blank"); // Abre em uma nova aba
        }
      });

      cy.on("tap", function (evt) {
        if (evt.target === cy) {
          resetAllStyles();
        }
      });


    });

  </script>
</body>

</html>
