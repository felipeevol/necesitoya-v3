      function getFeatureIcon(name) {
        var normalized = name.toLowerCase();

        if (normalized.indexOf("lambda") > -1) return "λ";
        if (normalized.indexOf("stream") > -1) return "≋";
        if (normalized.indexOf("date") > -1 || normalized.indexOf("time") > -1) return "◷";
        if (normalized.indexOf("http") > -1 || normalized.indexOf("web") > -1 || normalized.indexOf("socket") > -1) return "⌁";
        if (normalized.indexOf("record") > -1 || normalized.indexOf("class") > -1 || normalized.indexOf("object") > -1) return "▣";
        if (normalized.indexOf("pattern") > -1 || normalized.indexOf("switch") > -1) return "{}";
        if (normalized.indexOf("thread") > -1 || normalized.indexOf("concurr") > -1 || normalized.indexOf("scoped") > -1) return "⇄";
        if (normalized.indexOf("string") > -1 || normalized.indexOf("text") > -1 || normalized.indexOf("markdown") > -1) return "¶";
        if (normalized.indexOf("file") > -1 || normalized.indexOf("input") > -1 || normalized.indexOf("output") > -1 || normalized.indexOf("nio") > -1) return "▤";
        if (normalized.indexOf("security") > -1 || normalized.indexOf("tls") > -1 || normalized.indexOf("quantum") > -1 || normalized.indexOf("pem") > -1) return "◇";
        if (normalized.indexOf("module") > -1 || normalized.indexOf("package") > -1 || normalized.indexOf("import") > -1) return "⬡";
        if (normalized.indexOf("collection") > -1 || normalized.indexOf("list") > -1 || normalized.indexOf("map") > -1) return "▦";
        if (normalized.indexOf("optional") > -1 || normalized.indexOf("null") > -1) return "?";
        if (normalized.indexOf("annotation") > -1 || normalized.indexOf("javadoc") > -1) return "@";
        if (normalized.indexOf("enum") > -1 || normalized.indexOf("constant") > -1) return "◆";
        if (normalized.indexOf("constructor") > -1 || normalized.indexOf("method") > -1 || normalized.indexOf("interface") > -1) return "⚙";
        if (normalized.indexOf("exception") > -1 || normalized.indexOf("error") > -1) return "!";
        if (normalized.indexOf("performance") > -1 || normalized.indexOf("aot") > -1 || normalized.indexOf("gc") > -1 || normalized.indexOf("g1") > -1) return "↗";
        return "✦";
      }

        "Package and import": { es: `Organiza clases y permite usar tipos de otros paquetes.<br>Ejemplo: import java.util.List;`, pt: `Organiza classes e permite usar tipos de outros pacotes.<br>Exemplo: import java.util.List;` },
        "Constructors, attributes and methods": { es: `Inicializa objetos y agrupa datos con operaciones.<br>Ejemplo: Person(String n) { name = n; }`, pt: `Inicializa objetos e agrupa dados com operações.<br>Exemplo: Person(String n) { name = n; }` },
        "Inheritance and encapsulation": { es: `Reutiliza código y protege detalles internos de la clase.<br>Ejemplo: class Dog extends Animal { }`, pt: `Reutiliza código e protege detalhes internos da classe.<br>Exemplo: class Dog extends Animal { }` },
        "Abstract classes and interfaces": { es: `Modela contratos y bases compartidas para múltiples clases.<br>Ejemplo: interface Flyer { void fly(); }`, pt: `Modela contratos e bases compartilhadas para várias classes.<br>Exemplo: interface Flyer { void fly(); }` },
        "Primitive types and arrays": { es: `Almacena valores simples y colecciones de tamaño fijo.<br>Ejemplo: int[] nums = {1, 2, 3};`, pt: `Armazena valores simples e coleções de tamanho fixo.<br>Exemplo: int[] nums = {1, 2, 3};` },
        "Access modifiers": { es: `Controla quién puede ver clases, métodos y campos.<br>Ejemplo: private String password;`, pt: `Controla quem pode ver classes, métodos e campos.<br>Exemplo: private String password;` },
        "Control flow and operators": { es: `Controla decisiones, bucles y cálculos dentro del programa.<br>Ejemplo: if (age >= 18) { ... }`, pt: `Controla decisões, loops e cálculos dentro do programa.<br>Exemplo: if (age >= 18) { ... }` },
        "Polymorphism": { es: `Permite manejar diferentes objetos mediante un tipo común.<br>Ejemplo: Animal a = new Dog();`, pt: `Permite manipular objetos diferentes por meio de um tipo comum.<br>Exemplo: Animal a = new Dog();` },
        "Main method and super": { es: `Punto de entrada y acceso a miembros de la superclase.<br>Ejemplo: public static void main(String[] args)`, pt: `Ponto de entrada e acesso a membros da superclasse.<br>Exemplo: public static void main(String[] args)` },
        "Exceptions": { es: `Maneja errores y flujos excepcionales de forma estructurada.<br>Ejemplo: catch (IOException e) { ... }`, pt: `Trata erros e fluxos excepcionais de forma estruturada.<br>Exemplo: catch (IOException e) { ... }` },
        "Standard library": { es: `APIs integradas para tareas comunes del lenguaje.<br>Ejemplo: Math.max(3, 7);`, pt: `APIs integradas para tarefas comuns da linguagem.<br>Exemplo: Math.max(3, 7);` },
        "Collections": { es: `Estructuras como listas, mapas y conjuntos para datos.<br>Ejemplo: List<String> names = new ArrayList<>();`, pt: `Estruturas como listas, mapas e conjuntos para dados.<br>Exemplo: List<String> names = new ArrayList<>();` },
        "Input and output": { es: `Lee y escribe archivos, entrada de consola, redes y flujos de datos.<br>Ejemplo: Files.readString(path);`, pt: `Lê e escreve arquivos, entrada de console, redes e fluxos de dados.<br>Exemplo: Files.readString(path);` },
        "Threads": { es: `Ejecuta tareas concurrentes dentro del mismo proceso.<br>Ejemplo: new Thread(task).start();`, pt: `Executa tarefas concorrentes dentro do mesmo processo.<br>Exemplo: new Thread(task).start();` },
        "Java 5": { es: `Versión que modernizó tipos, metadatos y concurrencia.`, pt: `Versão que modernizou tipos, metadados e concorrência.` },
        "Versioning number": { es: `Introduce el esquema 5.0 para nombrar la plataforma.<br>Ejemplo: Java 5 también era Java 1.5.`, pt: `Introduz o esquema 5.0 para nomear a plataforma.<br>Exemplo: Java 5 também era Java 1.5.` },
        "Generics": { es: `Agrega tipos parametrizados para colecciones más seguras.<br>Ejemplo: List<String> evita conversiones al leer.`, pt: `Adiciona tipos parametrizados para coleções mais seguras.<br>Exemplo: List<String> evita conversões ao ler.` },
        "Annotations": { es: `Adjunta metadatos al código para herramientas y frameworks.<br>Ejemplo: @Override marca una sobrescritura.`, pt: `Anexa metadados ao código para ferramentas e frameworks.<br>Exemplo: @Override marca uma sobrescrita.` },
        "Enums": { es: `Define conjuntos fijos de constantes con su propio tipo.<br>Ejemplo: enum Day { MONDAY, TUESDAY }`, pt: `Define conjuntos fixos de constantes com seu próprio tipo.<br>Exemplo: enum Day { MONDAY, TUESDAY }` },
        "Varargs": { es: `Permite métodos con un número variable de argumentos.<br>Ejemplo: void log(String... messages)`, pt: `Permite métodos com um número variável de argumentos.<br>Exemplo: void log(String... messages)` },
        "Enhanced for-loop": { es: `Itera arrays y colecciones sin índices manuales.<br>Ejemplo: for (String s : list) { }`, pt: `Itera arrays e coleções sem índices manuais.<br>Exemplo: for (String s : list) { }` },
        "Autoboxing / unboxing": { es: `Convierte automáticamente entre primitivos y wrappers.<br>Ejemplo: Integer n = 10; int x = n;`, pt: `Converte automaticamente entre primitivos e wrappers.<br>Exemplo: Integer n = 10; int x = n;` },
        "Concurrency utilities": { es: `Agrega executors, locks y colecciones seguras para hilos.<br>Ejemplo: Executors.newFixedThreadPool(4);`, pt: `Adiciona executors, locks e coleções seguras para threads.<br>Exemplo: Executors.newFixedThreadPool(4);` },
        "Java 7": { es: `Versión centrada en sintaxis más limpia y E/S moderna.`, pt: `Versão focada em sintaxe mais limpa e E/S moderna.` },
        "Try-with-resources": { es: `Cierra recursos automáticamente al salir del bloque try.<br>Ejemplo: try (var in = Files.newInputStream(p)) { }`, pt: `Fecha recursos automaticamente ao sair do bloco try.<br>Exemplo: try (var in = Files.newInputStream(p)) { }` },
        "Diamond operator": { es: `Infiere tipos genéricos en constructores con <>.<br>Ejemplo: new ArrayList<>();`, pt: `Infere tipos genéricos em construtores com <>.<br>Exemplo: new ArrayList<>();` },
        "NIO.2": { es: `Mejora archivos, rutas y operaciones del sistema de archivos.<br>Ejemplo: Path p = Path.of("app.txt");`, pt: `Melhora arquivos, caminhos e operações do sistema de arquivos.<br>Exemplo: Path p = Path.of("app.txt");` },
        "Binary integer literals": { es: `Permite escribir enteros en formato binario con 0b.<br>Ejemplo: int mask = 0b1010;`, pt: `Permite escrever inteiros em formato binário com 0b.<br>Exemplo: int mask = 0b1010;` },
        "Switch with Strings": { es: `Permite valores String en instrucciones switch.<br>Ejemplo: switch (cmd) { case "run" -> ... }`, pt: `Permite valores String em instruções switch.<br>Exemplo: switch (cmd) { case "run" -> ... }` },
        "Underscores in numeric literals": { es: `Mejora la legibilidad separando dígitos con guiones bajos.<br>Ejemplo: int million = 1_000_000;`, pt: `Melhora a legibilidade separando dígitos com underscores.<br>Exemplo: int million = 1_000_000;` },
        "Catching multiple exception types": { es: `Captura varias excepciones en un solo bloque catch.<br>Ejemplo: catch (IOException | SQLException e)`, pt: `Captura várias exceções em um único bloco catch.<br>Exemplo: catch (IOException | SQLException e)` },
        "@SafeVarargs": { es: `Marca varargs genéricos como seguros frente a contaminación del heap.<br>Ejemplo: @SafeVarargs static <T> void add(T... v)`, pt: `Marca varargs genéricos como seguros contra poluição do heap.<br>Exemplo: @SafeVarargs static <T> void add(T... v)` },
        "Java 8": { es: `Versión LTS que introdujo programación funcional y una nueva API de fecha/hora.`, pt: `Versão LTS que introduziu programação funcional e uma nova API de data/hora.` },
        "Streams and lambda": { es: `Procesa datos con funciones y pipelines declarativos.<br>Ejemplo: nums.stream().map(n -> n * 2);`, pt: `Processa dados com funções e pipelines declarativos.<br>Exemplo: nums.stream().map(n -> n * 2);` },
        "Optionals": { es: `Representa valores que pueden faltar sin usar null.<br>Ejemplo: Optional.ofNullable(name).orElse("N/A");`, pt: `Representa valores que podem faltar sem usar null.<br>Exemplo: Optional.ofNullable(name).orElse("N/A");` },
        "Default methods": { es: `Permite métodos con implementación dentro de interfaces.<br>Ejemplo: default int size() { return 0; }`, pt: `Permite métodos com implementação dentro de interfaces.<br>Exemplo: default int size() { return 0; }` },
        "New Java Date and Time API": { es: `API moderna e inmutable para fechas, horas y zonas horarias.<br>Ejemplo: LocalDate.now().plusDays(1);`, pt: `API moderna e imutável para datas, horas e fusos horários.<br>Exemplo: LocalDate.now().plusDays(1);` },
        "Java 9": { es: `Versión que modularizó el JDK y mejoró APIs centrales.`, pt: `Versão que modularizou o JDK e melhorou APIs centrais.` },
        "Java Module System": { es: `Divide aplicaciones en módulos con dependencias explícitas.<br>Ejemplo: module app { requires java.sql; }`, pt: `Divide aplicações em módulos com dependências explícitas.<br>Exemplo: module app { requires java.sql; }` },
        "Immutable collections": { es: `Crea listas, conjuntos y mapas inmutables con métodos de fábrica.<br>Ejemplo: List.of("a", "b");`, pt: `Cria listas, conjuntos e mapas imutáveis com métodos de fábrica.<br>Exemplo: List.of("a", "b");` },
        "Improved try-with-resources": { es: `Permite usar variables final ya declaradas en try.<br>Ejemplo: try (reader) { return reader.read(); }`, pt: `Permite usar variáveis final já declaradas no try.<br>Exemplo: try (reader) { return reader.read(); }` },
        "Private methods in interfaces": { es: `Reutiliza lógica interna entre métodos de una interfaz.<br>Ejemplo: private void validate() { }`, pt: `Reutiliza lógica interna entre métodos de uma interface.<br>Exemplo: private void validate() { }` },
        "HTTP Client (incubator)": { es: `Primer cliente HTTP moderno con soporte asíncrono.<br>Ejemplo: HttpClient.newHttpClient();`, pt: `Primeiro cliente HTTP moderno com suporte assíncrono.<br>Exemplo: HttpClient.newHttpClient();` },
        "@SafeVarargs extended": { es: `Permite @SafeVarargs en más métodos final y private.<br>Ejemplo: @SafeVarargs private final void m(T... v)`, pt: `Permite @SafeVarargs em mais métodos final e private.<br>Exemplo: @SafeVarargs private final void m(T... v)` },
        "_ (underscore) is a reserved word": { es: `Reserva _ para uso futuro e impide usarlo como nombre.<br>Ejemplo: int _ = 1; ya no compila.`, pt: `Reserva _ para uso futuro e impede usá-lo como nome.<br>Exemplo: int _ = 1; não compila mais.` },
        "Optional enhancements": { es: `Agrega ifPresentOrElse, or y stream a Optional.<br>Ejemplo: opt.ifPresentOrElse(ok, empty);`, pt: `Adiciona ifPresentOrElse, or e stream ao Optional.<br>Exemplo: opt.ifPresentOrElse(ok, empty);` },
        "New Stream methods": { es: `Agrega takeWhile, dropWhile, ofNullable e iterate.<br>Ejemplo: stream.takeWhile(x -> x < 10);`, pt: `Adiciona takeWhile, dropWhile, ofNullable e iterate.<br>Exemplo: stream.takeWhile(x -> x < 10);` },
        "Process API improvements": { es: `Mejora el control y la información sobre procesos del sistema.<br>Ejemplo: ProcessHandle.current().pid();`, pt: `Melhora o controle e as informações sobre processos do sistema.<br>Exemplo: ProcessHandle.current().pid();` },
        "Diamond operator in anonymous classes": { es: `Permite <> también al crear clases anónimas genéricas.<br>Ejemplo: new Handler<>() { ... };`, pt: `Permite <> também ao criar classes anônimas genéricas.<br>Exemplo: new Handler<>() { ... };` },
        "JShell": { es: `REPL interactivo para probar código Java rápidamente.<br>Ejemplo: jshell> 2 + 2`, pt: `REPL interativo para testar código Java rapidamente.<br>Exemplo: jshell> 2 + 2` },
        "JLink": { es: `Crea runtimes Java personalizados con los módulos requeridos.<br>Ejemplo: jlink --add-modules app --output runtime`, pt: `Cria runtimes Java personalizados com os módulos necessários.<br>Exemplo: jlink --add-modules app --output runtime` },
        "Java 10": { es: `Versión de corto plazo centrada en inferencia local y colecciones.`, pt: `Versão de curto prazo focada em inferência local e coleções.` },
        "Local-variable type inference": { es: `Permite que var infiera tipos de variables locales.<br>Ejemplo: var names = List.of("Ana");`, pt: `Permite que var infira tipos de variáveis locais.<br>Exemplo: var names = List.of("Ana");` },
        "Unmodifiable collection copies": { es: `Copia colecciones en versiones inmutables con copyOf.<br>Ejemplo: List.copyOf(list);`, pt: `Copia coleções para versões imutáveis com copyOf.<br>Exemplo: List.copyOf(list);` },
        "Unmodifiable collectors": { es: `Recolecta streams directamente en colecciones inmutables.<br>Ejemplo: stream.collect(toUnmodifiableList());`, pt: `Coleta streams diretamente em coleções imutáveis.<br>Exemplo: stream.collect(toUnmodifiableList());` },
        "Optional.orElseThrow()": { es: `Lanza NoSuchElementException si el Optional está vacío.<br>Ejemplo: user.orElseThrow();`, pt: `Lança NoSuchElementException se o Optional estiver vazio.<br>Exemplo: user.orElseThrow();` },
        "Java 11": { es: `Versión LTS con cliente HTTP estable y mejoras en String.`, pt: `Versão LTS com cliente HTTP estável e melhorias em String.` },
        "HTTP Client API": { es: `Cliente HTTP/2 estándar con llamadas síncronas y asíncronas.<br>Ejemplo: client.send(request, BodyHandlers.ofString());`, pt: `Cliente HTTP/2 padrão com chamadas síncronas e assíncronas.<br>Exemplo: client.send(request, BodyHandlers.ofString());` },
        "String isBlank lines strip repeat": { es: `Nuevos métodos para inspeccionar, dividir y repetir texto.<br>Ejemplo: " hi ".strip().repeat(2);`, pt: `Novos métodos para inspecionar, dividir e repetir texto.<br>Exemplo: " hi ".strip().repeat(2);` },
        "Files readString writeString": { es: `Lee y escribe archivos completos como valores String.<br>Ejemplo: Files.writeString(path, "hello");`, pt: `Lê e escreve arquivos inteiros como valores String.<br>Exemplo: Files.writeString(path, "hello");` },
        "var in lambda parameters": { es: `Permite var en parámetros lambda para que puedan anotarse.<br>Ejemplo: (@Nonnull var s) -> s.trim()`, pt: `Permite var em parâmetros lambda para que possam ser anotados.<br>Exemplo: (@Nonnull var s) -> s.trim()` },
        "Optional.isEmpty()": { es: `Comprueba directamente si un Optional está vacío.<br>Ejemplo: if (opt.isEmpty()) { ... }`, pt: `Verifica diretamente se um Optional está vazio.<br>Exemplo: if (opt.isEmpty()) { ... }` },
        "Single-file source-code launch": { es: `Ejecuta un archivo .java sin compilarlo manualmente antes.<br>Ejemplo: java Hello.java`, pt: `Executa um arquivo .java sem compilá-lo manualmente antes.<br>Exemplo: java Hello.java` },
        "Java 12": { es: `Versión con vistas previas de switch y pequeñas APIs útiles.`, pt: `Versão com previews de switch e pequenas APIs úteis.` },
        "Switch expressions preview": { es: `Permite que switch devuelva valores como expresión.<br>Ejemplo: var r = switch (day) { case MONDAY -> 1; };`, pt: `Permite que switch retorne valores como expressão.<br>Exemplo: var r = switch (day) { case MONDAY -> 1; };` },
        "Collectors.teeing()": { es: `Combina dos collectors y fusiona sus resultados.<br>Ejemplo: teeing(counting(), maxBy(c), Result::new)`, pt: `Combina dois collectors e mescla seus resultados.<br>Exemplo: teeing(counting(), maxBy(c), Result::new)` },
        "String.indent()": { es: `Ajusta la sangría de cada línea dentro de un String.<br>Ejemplo: text.indent(2);`, pt: `Ajusta a indentação de cada linha dentro de uma String.<br>Exemplo: text.indent(2);` },
        "String.transform()": { es: `Aplica una función al String y devuelve el resultado.<br>Ejemplo: name.transform(String::trim);`, pt: `Aplica uma função à String e retorna o resultado.<br>Exemplo: name.transform(String::trim);` },
        "Files.mismatch()": { es: `Encuentra la primera diferencia entre dos archivos.<br>Ejemplo: Files.mismatch(a, b) == -1`, pt: `Encontra a primeira diferença entre dois arquivos.<br>Exemplo: Files.mismatch(a, b) == -1` },
        "Java 13": { es: `Versión con text blocks y una vista previa refinada de switch.`, pt: `Versão com text blocks e um preview refinado de switch.` },
        "Text blocks preview": { es: `Permite cadenas multilínea con triples comillas.<br>Ejemplo: String json = """{ "a": 1 }""";`, pt: `Permite strings multilinha com aspas triplas.<br>Exemplo: String json = """{ "a": 1 }""";` },
        "Switch expressions yield": { es: `Usa yield para devolver valores desde bloques switch.<br>Ejemplo: yield total + tax;`, pt: `Usa yield para retornar valores de blocos switch.<br>Exemplo: yield total + tax;` },
        "Socket API reimplementation": { es: `Reescribe sockets clásicos sobre una implementación moderna.<br>Ejemplo: Socket mantiene la API pero cambia internamente.`, pt: `Reescreve sockets clássicos sobre uma implementação moderna.<br>Exemplo: Socket mantém a API, mas muda internamente.` },
        "Java 14": { es: `Versión que estabilizó expresiones switch y probó records.`, pt: `Versão que estabilizou expressões switch e testou records.` },
        "Switch expressions": { es: `Switch puede devolver valores con una sintaxis más compacta.<br>Ejemplo: var type = switch (n) { case 1 -> "one"; };`, pt: `Switch pode retornar valores com sintaxe mais compacta.<br>Exemplo: var type = switch (n) { case 1 -> "one"; };` },
        "Records preview": { es: `Clases compactas para datos inmutables con poco código.<br>Ejemplo: record Point(int x, int y) { }`, pt: `Classes compactas para dados imutáveis com pouco código.<br>Exemplo: record Point(int x, int y) { }` },
        "Pattern matching instanceof preview": { es: `Combina instanceof con declaración automática de variables.<br>Ejemplo: if (obj instanceof String s) { }`, pt: `Combina instanceof com declaração automática de variáveis.<br>Exemplo: if (obj instanceof String s) { }` },
        "Helpful NullPointerExceptions": { es: `Muestra qué expresión exacta causó un NullPointerException.<br>Ejemplo: indica qué parte de a.b.c era null.`, pt: `Mostra qual expressão exata causou um NullPointerException.<br>Exemplo: indica qual parte de a.b.c era null.` },
        "Text blocks second preview": { es: `Refina cadenas multilínea antes de su versión final.<br>Ejemplo: """line 1\nline 2"""`, pt: `Refina strings multilinha antes da versão final.<br>Exemplo: """line 1\nline 2"""` },
        "Java 15": { es: `Versión con text blocks finales y la vista previa de sealed classes.`, pt: `Versão com text blocks finais e o preview de sealed classes.` },
        "Text blocks": { es: `Cadenas multilínea finales con formato más natural.<br>Ejemplo: String sql = """select * from users""";`, pt: `Strings multilinha finais com formatação mais natural.<br>Exemplo: String sql = """select * from users""";` },
        "Sealed classes preview": { es: `Limita qué clases pueden extender o implementar un tipo.<br>Ejemplo: sealed class Shape permits Circle { }`, pt: `Limita quais classes podem estender ou implementar um tipo.<br>Exemplo: sealed class Shape permits Circle { }` },
        "Records second preview": { es: `Refina records como clases concisas para transportar datos.<br>Ejemplo: record User(String name) { }`, pt: `Refina records como classes concisas para carregar dados.<br>Exemplo: record User(String name) { }` },
        "Hidden classes": { es: `Clases no detectables destinadas a frameworks y runtimes.<br>Ejemplo: proxies dinámicos para frameworks.`, pt: `Classes não descobríveis destinadas a frameworks e runtimes.<br>Exemplo: proxies dinâmicos para frameworks.` },
        "Java 16": { es: `Versión que finalizó records y pattern matching para instanceof.`, pt: `Versão que finalizou records e pattern matching para instanceof.` },
        "Records": { es: `Define datos inmutables con constructor y accesores automáticos.<br>Ejemplo: record User(String name, int age) { }`, pt: `Define dados imutáveis com construtor e acessores automáticos.<br>Exemplo: record User(String name, int age) { }` },
        "Pattern matching instanceof": { es: `Evita conversiones manuales después de comprobar instanceof.<br>Ejemplo: if (obj instanceof String s) s.length();`, pt: `Evita casts manuais depois de verificar instanceof.<br>Exemplo: if (obj instanceof String s) s.length();` },
        "Stream.toList()": { es: `Convierte un stream en una lista con un método directo.<br>Ejemplo: var list = stream.toList();`, pt: `Converte um stream em uma lista com um método direto.<br>Exemplo: var list = stream.toList();` },
        "Sealed classes second preview": { es: `Segunda vista previa para controlar jerarquías de herencia.<br>Ejemplo: sealed interface Expr permits Add, Num { }`, pt: `Segundo preview para controlar hierarquias de herança.<br>Exemplo: sealed interface Expr permits Add, Num { }` },
        "Unix-domain socket channels": { es: `Permite que procesos locales se comuniquen con sockets de dominio Unix.<br>Ejemplo: UnixDomainSocketAddress.of("/tmp/app.sock")`, pt: `Permite que processos locais se comuniquem usando sockets de domínio Unix.<br>Exemplo: UnixDomainSocketAddress.of("/tmp/app.sock")` },
        "Java 17": { es: `Versión LTS con sealed classes y nuevas APIs de seguridad.`, pt: `Versão LTS com sealed classes e novas APIs de segurança.` },
        "Sealed classes": { es: `Restringe subclases permitidas para modelar dominios cerrados.<br>Ejemplo: sealed interface Payment permits Pix, Card { }`, pt: `Restringe subclasses permitidas para modelar domínios fechados.<br>Exemplo: sealed interface Payment permits Pix, Card { }` },
        "Pattern matching switch preview": { es: `Permite switch sobre tipos de objetos y patrones.<br>Ejemplo: case String s -> s.length();`, pt: `Permite switch sobre tipos de objetos e padrões.<br>Exemplo: case String s -> s.length();` },
        "Enhanced pseudo-random generators": { es: `Nuevas interfaces y algoritmos para números aleatorios.<br>Ejemplo: RandomGenerator.of("L64X128MixRandom")`, pt: `Novas interfaces e algoritmos para números aleatórios.<br>Exemplo: RandomGenerator.of("L64X128MixRandom")` },
        "Context-specific deserialization filters": { es: `Filtra la deserialización por contexto para mayor seguridad.<br>Ejemplo: filtrar clases permitidas al deserializar.`, pt: `Filtra a desserialização por contexto para maior segurança.<br>Exemplo: filtrar classes permitidas ao desserializar.` },
        "Foreign Function and Memory incubator": { es: `Accede a código nativo y memoria externa desde Java.<br>Ejemplo: leer memoria nativa con MemorySegment.`, pt: `Acessa código nativo e memória externa a partir do Java.<br>Exemplo: ler memória nativa com MemorySegment.` },
        "Java 18": { es: `Versión con UTF-8 por defecto y un servidor simple.`, pt: `Versão com UTF-8 por padrão e um servidor simples.` },
        "UTF-8 by default": { es: `Usa UTF-8 como charset predeterminado de la plataforma.<br>Ejemplo: new String(bytes) usa UTF-8 por defecto.`, pt: `Usa UTF-8 como charset padrão da plataforma.<br>Exemplo: new String(bytes) usa UTF-8 por padrão.` },
        "Simple Web Server": { es: `Pequeño servidor HTTP para archivos estáticos y pruebas.<br>Ejemplo: jwebserver -p 8000`, pt: `Pequeno servidor HTTP para arquivos estáticos e testes.<br>Exemplo: jwebserver -p 8000` },
        "Code snippets in JavaDoc": { es: `Permite ejemplos de código validados dentro de JavaDoc.<br>Ejemplo: {@snippet : int x = 1; }`, pt: `Permite exemplos de código validados dentro do JavaDoc.<br>Exemplo: {@snippet : int x = 1; }` },
        "Pattern matching switch second preview": { es: `Segunda vista previa de switch con patrones de tipo.<br>Ejemplo: case Integer i -> i + 1;`, pt: `Segundo preview de switch com padrões de tipo.<br>Exemplo: case Integer i -> i + 1;` },
        "Vector API third incubator": { es: `Opera datos en paralelo usando instrucciones vectoriales.<br>Ejemplo: sumar arrays con IntVector.`, pt: `Opera dados em paralelo usando instruções vetoriais.<br>Exemplo: somar arrays com IntVector.` },

      function applyGraphTransform() {
        chartContainer.style.transform = "translate(" + graphState.panX + "px, " + graphState.panY + "px) scale(" + graphState.zoom + ")";
      }

      var titleHalfWidth = 165;
      var nodeHalfWidth = 175;
      var titleHalfHeight = 48;
      var nodeHalfHeight = 37;
      var nodeVisualGap = 30;

      function getNodesBounds(nodes) {
        return nodes.reduce(function (bounds, node) {
          var halfWidth = node.category ? titleHalfWidth : nodeHalfWidth;
          var halfHeight = getNodeHalfHeight(node);
          return {
            x1: Math.min(bounds.x1, node.position.x - halfWidth),
            y1: Math.min(bounds.y1, node.position.y - halfHeight),
            x2: Math.max(bounds.x2, node.position.x + halfWidth),
            y2: Math.max(bounds.y2, node.position.y + halfHeight)
          };
        }, { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity });
      }

      function getNodeHalfHeight(node) {
        if (node.element && node.element.offsetHeight) {
          return node.element.offsetHeight / 2;
        }

        return node.category ? titleHalfHeight : nodeHalfHeight;
      }

      function updateChartHeight() {
        var bounds = getNodesBounds(graphNodes);
        chartContainer.style.minHeight = Math.max(2100, Math.ceil(bounds.y2 + 160)) + "px";
      }

      function applyColumnSpacing() {
        var columns = {};

        graphNodes.forEach(function (node) {
          var columnKey = String(node.originalPosition.x);
          if (!columns[columnKey]) {
            columns[columnKey] = [];
          }
          columns[columnKey].push(node);
        });

        Object.keys(columns).forEach(function (columnKey) {
          var columnNodes = columns[columnKey].sort(function (a, b) {
            return a.originalPosition.y - b.originalPosition.y;
          });
          var previousNode = null;

          columnNodes.forEach(function (node, index) {
            node.position.x = node.originalPosition.x;

            if (index < 2 || !previousNode) {
              node.position.y = node.originalPosition.y;
            } else {
              node.position.y = Math.round(
                previousNode.position.y
                + getNodeHalfHeight(previousNode)
                + getNodeHalfHeight(node)
                + nodeVisualGap
              );
            }

            if (node.element) {
              node.element.style.left = node.position.x + "px";
              node.element.style.top = node.position.y + "px";
            }

            previousNode = node;
          });
        });

        updateChartHeight();
      }

      function renderTimeline() {
        var svgNS = "http://www.w3.org/2000/svg";
        var timelineSvg = document.createElementNS(svgNS, "svg");
        var defs = document.createElementNS(svgNS, "defs");
        var marker = document.createElementNS(svgNS, "marker");
        marker.setAttribute("id", "timeline-arrow");
        marker.setAttribute("viewBox", "0 0 10 10");
        marker.setAttribute("refX", "9");
        marker.setAttribute("refY", "5");
        marker.setAttribute("markerWidth", "6");
        marker.setAttribute("markerHeight", "6");
        marker.setAttribute("orient", "auto-start-reverse");

        var arrow = document.createElementNS(svgNS, "path");
        arrow.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
        arrow.setAttribute("fill", "#ff8a24");
        marker.appendChild(arrow);
        defs.appendChild(marker);
        timelineSvg.appendChild(defs);
        timelineSvg.classList.add("timeline-layer");

        for (var timelineIndex = 0; timelineIndex < timelineNodes.length - 1; timelineIndex++) {
          var source = timelineNodes[timelineIndex];
          var target = timelineNodes[timelineIndex + 1];
          var line = document.createElementNS(svgNS, "line");
          line.classList.add("timeline-line");
          line.setAttribute("x1", source.position.x + titleHalfWidth);
          line.setAttribute("y1", source.position.y);
          line.setAttribute("x2", target.position.x - titleHalfWidth);
          line.setAttribute("y2", target.position.y);
          line.setAttribute("marker-end", "url(#timeline-arrow)");
          timelineSvg.appendChild(line);
        }

        chartContainer.appendChild(timelineSvg);
      }

      function renderNodes() {
        graphNodes.forEach(function (node) {
          var nodeElement = document.createElement("button");
          nodeElement.type = "button";
          nodeElement.className = "chart-node";
          nodeElement.style.left = node.position.x + "px";
          nodeElement.style.top = node.position.y + "px";
          nodeElement.setAttribute("data-node-id", node.id);
          nodeElement.setAttribute("aria-label", node.name);

          if (node.category === "title") {
            nodeElement.classList.add("title");
          } else if (node.category === "title_lts") {
            nodeElement.classList.add("title-lts");
          }

          if (node.accent === "orange") {
            nodeElement.classList.add("accent-orange");
          }

          if (isLtsFeatureNode(node)) {
            nodeElement.classList.add("lts-light");
          }

          nodeElement.graphNode = node;
          node.element = nodeElement;
          chartContainer.appendChild(nodeElement);
        });
      }

      function updateNodeElements() {
        graphNodes.forEach(function (node) {
          if (!node.element) {
            return;
          }

          node.element.textContent = node.label;
          node.element.setAttribute("aria-label", node.name);
        });

        applyColumnSpacing();
      }

      renderTimeline();
      renderNodes();

      function translateTitleName(originalName, language) {
        if (language === "en" || originalName.indexOf(" - ") === -1) {
          return originalName;
        }

        var separatorIndex = originalName.indexOf(" - ");
        var prefix = originalName.substring(0, separatorIndex);
        var suffix = originalName.substring(separatorIndex + 3);
        var translatedSuffix = releaseDateTranslations[language][suffix] || suffix;
        return prefix + " - " + translatedSuffix;
      }

      function applyLanguage(language) {
        graphNodes.forEach(function (node) {
          var nodeTranslations = descriptionTranslations[node.id];
          node.name = translateTitleName(node.nameEn, language);
          node.description = language === "en"
            ? node.descriptionEn
            : ((nodeTranslations && nodeTranslations[language]) || node.descriptionEn);
          node.label = buildNodeLabel(node.name, node.category, node.icon);
        });
        updateNodeElements();

        languageButtons.forEach(function (button) {
          var isActive = button.getAttribute("data-language") === language;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
          button.setAttribute("aria-expanded", isActive && languageSwitcher.classList.contains("open") ? "true" : "false");
        });

        subscribePopupLanguageButtons.forEach(function (button) {
          var isActive = button.getAttribute("data-language") === language;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });

        languageHint.textContent = instructionTranslations[language] || instructionTranslations.en;
        var subscribeTranslation = subscribeTranslations[language] || subscribeTranslations.en;
        subscribePopupTitle.textContent = subscribeTranslation.title;
        subscribePopupText.textContent = subscribeTranslation.message;
        subscribePopupButton.textContent = subscribeTranslation.label;
        subscribePopupButton.setAttribute("href", subscribeTranslation.url);
        subscribePopupButton.setAttribute("aria-label", subscribeTranslation.label);
        subscribePopupClose.setAttribute("aria-label", subscribeTranslation.closeLabel);
        var unsubscribeTranslation = unsubscribeTranslations[language] || unsubscribeTranslations.en;
        unsubscribeLink.textContent = unsubscribeTranslation.label;
        unsubscribeLink.setAttribute("href", unsubscribeTranslation.url);
        unsubscribeLink.setAttribute("aria-label", unsubscribeTranslation.label);
        document.documentElement.setAttribute("lang", language);
      }

      function setLanguageMenuOpen(isOpen) {
        languageSwitcher.classList.toggle("open", isOpen);
        var menuIndex = 1;
        languageButtons.forEach(function (button) {
          if (!button.classList.contains("active")) {
            button.style.setProperty("--language-menu-offset", (menuIndex * 40) + "px");
            menuIndex += 1;
          } else {
            button.style.removeProperty("--language-menu-offset");
          }
          button.setAttribute("aria-expanded", button.classList.contains("active") && isOpen ? "true" : "false");
        });
      }

      function getInitialLanguage() {
        var language = new URLSearchParams(window.location.search).get("lang");
        return ["en", "es", "pt"].indexOf(language) > -1 ? language : "en";
      }

      languageButtons.forEach(function (button) {
        button.addEventListener("click", function (event) {
          event.stopPropagation();
          if (button.classList.contains("active")) {
            setLanguageMenuOpen(!languageSwitcher.classList.contains("open"));
            return;
          }

          applyLanguage(button.getAttribute("data-language"));
          setLanguageMenuOpen(false);
        });
      });

      subscribePopupLanguageButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          applyLanguage(button.getAttribute("data-language"));
          setLanguageMenuOpen(false);
        });
      });

      subscribePopupClose.addEventListener("click", function () {
        subscribePopup.classList.add("is-hidden");
      });

      subscribePopup.addEventListener("click", function (event) {
        if (event.target === subscribePopup) {
          subscribePopup.classList.add("is-hidden");
        }
      });

      document.addEventListener("click", function () {
        setLanguageMenuOpen(false);
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          setLanguageMenuOpen(false);
          subscribePopup.classList.add("is-hidden");
        }
      });

      applyLanguage(getInitialLanguage());

      function fitGraphToVisibleArea() {
        var visibleWidth = chartScroll.clientWidth;
        var isSmallScreen = visibleWidth <= 640;
        var padding = isSmallScreen ? 18 : 10;
        var initialHorizontalOffset = isSmallScreen ? 16 : 72;
        var initialVerticalOffset = 72;
        var lastInitialColumn = isSmallScreen ? coluna1 : coluna6;
        var initialVisibleBounds = getNodesBounds(graphNodes.filter(function (node) {
          return node.position.x <= lastInitialColumn;
        }));
        var boundsWidth = initialVisibleBounds.x2 - initialVisibleBounds.x1;
        var availableWidth = Math.max(visibleWidth - (padding * 2), 1);
        graphState.zoom = Math.min(0.82, Math.max(graphState.minZoom, availableWidth / boundsWidth));
        graphState.panX = ((visibleWidth - (graphState.zoom * (initialVisibleBounds.x1 + initialVisibleBounds.x2))) / 2) + initialHorizontalOffset;
        graphState.panY = initialVerticalOffset - (graphState.zoom * initialVisibleBounds.y1);
        applyGraphTransform();
      }

      fitGraphToVisibleArea();
      window.addEventListener("resize", fitGraphToVisibleArea);

      var nodePanState = {
        active: false,
        lastX: 0,
        lastY: 0,
        moved: false,
        targetNode: null,
        targetNodeData: null
      };
      var touchZoomState = {
        active: false,
        startDistance: 0,
        startZoom: 1
      };
      var suppressNextNodeTap = false;
      var lastTouchTooltipTime = 0;

      function getPointerPoint(evt) {
        if (evt.touches && evt.touches.length > 0) {
          return { x: evt.touches[0].clientX, y: evt.touches[0].clientY };
        }

        if (evt.changedTouches && evt.changedTouches.length > 0) {
          return { x: evt.changedTouches[0].clientX, y: evt.changedTouches[0].clientY };
        }

        if (typeof evt.clientX === "number" && typeof evt.clientY === "number") {
          return { x: evt.clientX, y: evt.clientY };
        }

        return null;
      }

      function preventNodePanDefault(evt) {
        if (!evt) {
          return;
        }

        evt.preventDefault();
        evt.stopPropagation();
      }

      function getTouchDistance(touches) {
        var deltaX = touches[0].clientX - touches[1].clientX;
        var deltaY = touches[0].clientY - touches[1].clientY;
        return Math.sqrt((deltaX * deltaX) + (deltaY * deltaY));
      }

      function getTouchCenter(touches) {
        return {
          x: (touches[0].clientX + touches[1].clientX) / 2,
          y: (touches[0].clientY + touches[1].clientY) / 2
        };
      }

      function clampZoom(zoom) {
        return Math.max(graphState.minZoom, Math.min(graphState.maxZoom, zoom));
      }

      function zoomAtClientPoint(clientX, clientY, nextZoom) {
        var rect = chartScroll.getBoundingClientRect();
        var viewportX = clientX - rect.left;
        var viewportY = clientY - rect.top;
        var graphX = (viewportX - graphState.panX) / graphState.zoom;
        var graphY = (viewportY - graphState.panY) / graphState.zoom;

        graphState.panX = viewportX - (graphX * nextZoom);
        graphState.panY = viewportY - (graphY * nextZoom);
        graphState.zoom = nextZoom;
        applyGraphTransform();
      }

      function startTouchZoom(evt) {
        if (!evt.touches || evt.touches.length < 2) {
          return false;
        }

        touchZoomState.active = true;
        touchZoomState.startDistance = getTouchDistance(evt.touches);
        touchZoomState.startZoom = graphState.zoom;
        nodePanState.active = false;
        nodePanState.moved = true;
        chartContainer.classList.remove("is-node-panning");
        tooltipDiv.style.display = "none";
        preventNodePanDefault(evt);
        return true;
      }

      function continueTouchZoom(evt) {
        if (!evt.touches || evt.touches.length < 2) {
          return false;
        }

        if (!touchZoomState.active) {
          return startTouchZoom(evt);
        }

        var distance = getTouchDistance(evt.touches);
        if (touchZoomState.startDistance > 0) {
          var center = getTouchCenter(evt.touches);
          var nextZoom = clampZoom(touchZoomState.startZoom * (distance / touchZoomState.startDistance));
          zoomAtClientPoint(center.x, center.y, nextZoom);
        }

        preventNodePanDefault(evt);
        return true;
      }

      function startNodePan(evt) {
        if (startTouchZoom(evt)) {
          return;
        }

        var point = getPointerPoint(evt);
        if (!point) {
          return;
        }

        nodePanState.active = true;
        nodePanState.lastX = point.x;
        nodePanState.lastY = point.y;
        nodePanState.moved = false;
        nodePanState.targetNode = evt.currentTarget;
        nodePanState.targetNodeData = evt.currentTarget.graphNode || null;
        chartContainer.classList.add("is-node-panning");
        tooltipDiv.style.display = "none";
        preventNodePanDefault(evt);
      }

      function continueNodePan(evt) {
        if (continueTouchZoom(evt)) {
          suppressNextNodeTap = true;
          return;
        }

        if (!nodePanState.active) {
          return;
        }

        var point = getPointerPoint(evt);
        if (!point) {
          return;
        }

        var deltaX = point.x - nodePanState.lastX;
        var deltaY = point.y - nodePanState.lastY;

        if (deltaX !== 0 || deltaY !== 0) {
          graphState.panX += deltaX;
          graphState.panY += deltaY;
          applyGraphTransform();
          nodePanState.lastX = point.x;
          nodePanState.lastY = point.y;

          if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) {
            nodePanState.moved = true;
            suppressNextNodeTap = true;
          }
        }

        preventNodePanDefault(evt);
      }

      function stopNodePan(evt) {
        if (touchZoomState.active) {
          if (!evt.touches || evt.touches.length < 2) {
            touchZoomState.active = false;
            suppressNextNodeTap = true;
            window.setTimeout(function () {
              suppressNextNodeTap = false;
            }, 350);
          }

          preventNodePanDefault(evt);
          return;
        }

        if (!nodePanState.active) {
          return;
        }

        var tappedNode = !nodePanState.moved && nodePanState.targetNodeData;
        nodePanState.active = false;
        var targetNodeData = nodePanState.targetNodeData;
        nodePanState.targetNode = null;
        nodePanState.targetNodeData = null;
        chartContainer.classList.remove("is-node-panning");

        if (nodePanState.moved) {
          window.setTimeout(function () {
            suppressNextNodeTap = false;
          }, 350);
        } else if (evt.type === "touchend" && tappedNode) {
          lastTouchTooltipTime = new Date().getTime();
          showTooltip(targetNodeData, evt);
        }

        preventNodePanDefault(evt);
      }

      graphNodes.forEach(function (node) {
        node.element.addEventListener("mousedown", startNodePan);
        node.element.addEventListener("touchstart", startNodePan, { passive: false });
      });
      chartContainer.addEventListener("mousedown", startNodePan);
      chartContainer.addEventListener("touchstart", startNodePan, { passive: false });
      window.addEventListener("mousemove", continueNodePan, { passive: false });
      window.addEventListener("touchmove", continueNodePan, { passive: false });
      window.addEventListener("mouseup", stopNodePan);
      window.addEventListener("touchend", stopNodePan);
      window.addEventListener("touchcancel", stopNodePan);

      chartContainer.addEventListener("wheel", function (evt) {
        if (!evt.ctrlKey) {
          return;
        }

        evt.preventDefault();

        var zoomFactor = Math.pow(1.05, -evt.deltaY / 100);
        var nextZoom = clampZoom(graphState.zoom * zoomFactor);
        zoomAtClientPoint(evt.clientX, evt.clientY, nextZoom);
      }, { passive: false });

      function boldDescriptionExampleLine(description) {
        if (!description) {
          return "";
        }

        return description.replace(/<br>(Example:|Ejemplo:|Exemplo:)(.*)$/g, "<br><strong>$1$2</strong>");
      }

      function getEventClientPoint(evt) {
        if (evt.changedTouches && evt.changedTouches.length > 0) {
          return { x: evt.changedTouches[0].clientX, y: evt.changedTouches[0].clientY };
        }

        if (evt.touches && evt.touches.length > 0) {
          return { x: evt.touches[0].clientX, y: evt.touches[0].clientY };
        }

        if (typeof evt.clientX === "number" && typeof evt.clientY === "number") {
          return { x: evt.clientX, y: evt.clientY };
        }

        return { x: 16, y: 16 };
      }

      function positionTooltip(evt) {
        var point = getEventClientPoint(evt);
        var offset = 15;
        var left = point.x + offset;
        var top = point.y + offset;
        var maxLeft = window.innerWidth - tooltipDiv.offsetWidth - 16;
        var maxTop = window.innerHeight - tooltipDiv.offsetHeight - 16;

        tooltipDiv.style.left = Math.max(16, Math.min(left, maxLeft)) + "px";
        tooltipDiv.style.top = Math.max(16, Math.min(top, maxTop)) + "px";
      }

      function showTooltip(node, evt) {
        tooltipDiv.innerHTML = boldDescriptionExampleLine(node.description);
        tooltipDiv.style.display = "block";
        positionTooltip(evt);
      }

      let lastClickTime = 0;

      graphNodes.forEach(function (node) {
        node.element.addEventListener("click", function (evt) {
          if (suppressNextNodeTap || new Date().getTime() - lastTouchTooltipTime < 400) {
            suppressNextNodeTap = false;
            return;
          }

          showTooltip(node, evt);

          var now = new Date().getTime();
          var timeDiff = now - lastClickTime;
          lastClickTime = now;

          if (timeDiff < 300 && node.linkURL) {
            window.open(node.linkURL, "_blank");
          }
        });

        node.element.addEventListener("contextmenu", function (evt) {
          evt.preventDefault();

          if (node.rightLinkURL) {
            window.open(node.rightLinkURL, "_blank");
          }
        });
      });

      document.addEventListener("click", function (evt) {
        var clickTarget = evt.target && evt.target.nodeType === Node.TEXT_NODE
          ? evt.target.parentElement
          : evt.target;

        if (clickTarget && clickTarget.closest && clickTarget.closest(".chart-node")) {
          return;
        }

        tooltipDiv.style.display = "none";
      });

    });

  </script>
</body>
