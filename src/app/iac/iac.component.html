<div
  class="subscribe-popup"
  [class.is-hidden]="!subscribePopupVisible"
  role="dialog"
  aria-modal="true"
  aria-label="IaC Examples"
  aria-describedby="subscribe-popup-text"
  (click)="closeSubscribePopupOnBackdrop($event)">
  <div class="subscribe-popup-card">
    <button
      class="subscribe-popup-close"
      type="button"
      [attr.aria-label]="subscribePopupContent.closeLabel"
      (click)="closeSubscribePopup()">
      ×
    </button>
    <div class="subscribe-popup-kicker">IaC Examples</div>
    <p class="subscribe-popup-text" id="subscribe-popup-text">
      {{ subscribePopupContent.message }}
    </p>
    <div class="subscribe-popup-languages" aria-label="Popup language selector">
      <button
        *ngFor="let option of languageOptions"
        class="subscribe-popup-language"
        [class.active]="currentLocale === option.code"
        type="button"
        [attr.data-language]="option.code"
        [attr.aria-label]="getLanguageLabel(option.code)"
        [attr.title]="getLanguageLabel(option.code)"
        [attr.aria-pressed]="currentLocale === option.code"
        (click)="setPopupLanguage(option.code)">
        <span aria-hidden="true" class="flag-icon">
          <img [src]="option.flagSrc" alt="">
        </span>
      </button>
    </div>
    <a
      class="subscribe-popup-button"
      [href]="subscribePopupContent.url"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="subscribePopupContent.label">
      {{ subscribePopupContent.label }}
    </a>
  </div>
</div>

<section class="iac-hero">
  <div class="container hero-grid">
    <div class="hero">
      <span class="badge">{{ currentPage.badge }}</span>
      <h1>{{ currentPage.title }}</h1>
      <p>{{ currentPage.subtitle }}</p>
    </div>
    <div class="hero-side">
      <div class="hero-card filter-card">
        <div class="filter-card-header">
          <h2>{{ currentPage.filtersTitle }}</h2>
          <button
            type="button"
            class="filter-switch all-filter-switch"
            [class.active]="isFilterActive('all')"
            role="switch"
            [attr.aria-checked]="isFilterActive('all')"
            (click)="setFilter('all')">
            <span class="filter-switch-track" aria-hidden="true">
              <span class="filter-switch-thumb"></span>
            </span>
            <span class="filter-switch-label">{{ currentPage.filters.all }}</span>
          </button>
        </div>
        <div class="filter-list" role="group" [attr.aria-label]="currentPage.filtersTitle">
          <button
            *ngFor="let filter of categoryFilters"
            type="button"
            class="filter-switch"
            [class.active]="isFilterActive(filter)"
            role="switch"
            [attr.aria-checked]="isFilterActive(filter)"
            (click)="setFilter(filter)">
            <span class="filter-switch-track" aria-hidden="true">
              <span class="filter-switch-thumb"></span>
            </span>
            <span class="filter-switch-label">{{ currentPage.filters[filter] }}</span>
          </button>
        </div>
      </div>
      <aside class="card file-card">
        <h2>{{ currentPage.filesTitle }}</h2>
        <label *ngFor="let file of visibleFiles" class="file-option">
          <input
            type="radio"
            name="iacFile"
            [checked]="selectedFileName === file.fileName"
            (change)="selectFile(file.fileName)">
          <span>
            <strong>{{ file.fileName }}</strong>
          </span>
        </label>
        <a class="download-link" [href]="'download/' + selectedFile.fileName" download>
          {{ currentPage.downloadSelected }}
        </a>
      </aside>
    </div>
  </div>
</section>

<main class="iac-content">
  <section class="container">
    <div class="layout">
      <app-auto-scaling-detail
        *ngIf="selectedFileName === 'AutoScaling1.yaml'"
        [currentPage]="currentPage"
        [activeCommandPlatform]="activeCommandPlatform"
        [copiedCommand]="copiedCommand"
        (commandPlatformChange)="setCommandPlatform($event.group, $event.platform)"
        (commandCopy)="copyCommand($event.group, $event.platform)">
      </app-auto-scaling-detail>

      <app-load-balancer-auto-scaling-detail
        *ngIf="selectedFileName === 'LoadBalancerAutoScaling1.yaml'"
        [currentPage]="currentPage"
        [activeCommandPlatform]="activeCommandPlatform"
        [copiedCommand]="copiedCommand"
        (commandPlatformChange)="setCommandPlatform($event.group, $event.platform)"
        (commandCopy)="copyCommand($event.group, $event.platform)">
      </app-load-balancer-auto-scaling-detail>
    </div>
  </section>
</main>
